{# Avatar: a person icon in a coloured circle. Usage: avatar("teal", "lg") #}
{% macro avatar(colour_key, size="lg", label=None) -%}
<span class="avatar avatar-{{ size }}" style="--avatar: {{ avatar_colour(colour_key) }}"
	{%- if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}>
	<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
		<circle cx="12" cy="9" r="3.6" />
		<path d="M5.5 19.5c1.4-3 3.8-4.5 6.5-4.5s5.1 1.5 6.5 4.5" />
	</svg>
</span>
{%- endmacro %}
