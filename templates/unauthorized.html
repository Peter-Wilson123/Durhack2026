{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{# Pages that need sign-in show this. Send people straight to the sign-in page. #}
{% block head %}
<meta http-equiv="refresh" content="0; url={{ url_for('login_get') }}">
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
	<div class="card" style="width: 100%; max-width: 400px;">
		<div class="card-body">
			<h1 class="h3 mb-3">Please sign in</h1>
			<p class="mb-3">You need to sign in to see this page.</p>
			<a class="btn btn-primary w-100" href="{{ url_for('login_get') }}">Go to sign in</a>
		</div>
	</div>
</div>
{% endblock %}
