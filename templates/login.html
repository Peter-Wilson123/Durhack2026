{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<h1>Sign in</h1>

<form method="post" action="/login">
	<label for="identifier">CIS code or username</label>
    <input type="text" id="identifier" name="identifier" placeholder="CIS code or username" required>

	<label for="password">Password</label>
	<input type="password" id="password" name="password" required>

	<button type="submit">Sign in</button>
</form>
{% endblock %}
